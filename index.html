<head>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Onest & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Onest', sans-serif;
            cursor: url('https://r2.guns.lol/353e06fc-b4e8-40b9-be00-0f982dbf0d2f.png') 16 16, auto !important;
        }

        body {
            background-color: #000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.6;
        }

        /* Relaxed Rain Particles */
        .raindrops {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            top: -20vh;
            width: 2px;
            height: 16px;
            background: linear-gradient(180deg, rgba(200,230,255,0.95), rgba(150,200,255,0.6));
            border-radius: 2px;
            opacity: 0.85;
            filter: drop-shadow(0 0 6px rgba(140,190,255,0.12));
            transform: translate3d(0,0,0);
            animation: fall linear infinite;
            will-change: transform, opacity;
        }

        /* Slight head sparkle for some drops */
        .raindrop::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(220,240,255,0.9);
            opacity: 0.08;
            filter: blur(1px);
        }

        @keyframes fall {
            0% {
                transform: translate3d(var(--start-x, 0px), -10vh, 0) rotate(var(--angle, 8deg));
                opacity: var(--start-opacity, 0.9);
            }
            100% {
                transform: translate3d(var(--end-x, 30px), 110vh, 0) rotate(var(--angle, 8deg));
                opacity: var(--end-opacity, 0.45);
            }
        }

        /* Create variety: different start positions, durations, delays */
        .raindrop:nth-child(1)  { left: 2%;  --start-x:-8px;  --end-x:20px;  animation-duration: 5.8s;  animation-delay: 0s;  --angle:6deg; }
        .raindrop:nth-child(2)  { left: 6%;  --start-x:-6px;  --end-x:18px;  animation-duration: 6.4s;  animation-delay: 0.6s; --angle:7deg; }
        .raindrop:nth-child(3)  { left: 10%; --start-x:-10px; --end-x:25px;  animation-duration: 7.2s;  animation-delay: 0.4s; --angle:9deg; }
        .raindrop:nth-child(4)  { left: 14%; --start-x:-4px;  --end-x:12px;  animation-duration: 5.2s;  animation-delay: 1.0s; --angle:5deg; }
        .raindrop:nth-child(5)  { left: 18%; --start-x:-12px; --end-x:28px;  animation-duration: 8.0s;  animation-delay: 0.2s; --angle:10deg; }
        .raindrop:nth-child(6)  { left: 22%; --start-x:-6px;  --end-x:20px;  animation-duration: 6.8s;  animation-delay: 0.9s; --angle:7deg; }
        .raindrop:nth-child(7)  { left: 26%; --start-x:-9px;  --end-x:22px;  animation-duration: 7.6s;  animation-delay: 0.3s; --angle:8deg; }
        .raindrop:nth-child(8)  { left: 30%; --start-x:-5px;  --end-x:14px;  animation-duration: 5.6s;  animation-delay: 0.7s; --angle:6deg; }
        .raindrop:nth-child(9)  { left: 34%; --start-x:-11px; --end-x:30px;  animation-duration: 8.4s;  animation-delay: 0.1s; --angle:11deg; }
        .raindrop:nth-child(10) { left: 38%; --start-x:-7px;  --end-x:18px;  animation-duration: 6.1s;  animation-delay: 0.5s; --angle:7deg; }
        .raindrop:nth-child(11) { left: 42%; --start-x:-8px;  --end-x:21px;  animation-duration: 7.0s;  animation-delay: 0.8s; --angle:8deg; }
        .raindrop:nth-child(12) { left: 46%; --start-x:-3px;  --end-x:10px;  animation-duration: 5.4s;  animation-delay: 1.1s; --angle:5deg; }
        .raindrop:nth-child(13) { left: 50%; --start-x:-9px;  --end-x:23px;  animation-duration: 7.8s;  animation-delay: 0.15s; --angle:9deg; }
        .raindrop:nth-child(14) { left: 58%; --start-x:-6px;  --end-x:16px;  animation-duration: 6.5s;  animation-delay: 0.45s; --angle:6deg; }
        .raindrop:nth-child(15) { left: 64%; --start-x:-10px; --end-x:26px;  animation-duration: 8.2s;  animation-delay: 0.25s; --angle:10deg; }
        .raindrop:nth-child(16) { left: 70%; --start-x:-4px;  --end-x:12px;  animation-duration: 5.5s;  animation-delay: 0.95s; --angle:5deg; }
        .raindrop:nth-child(17) { left: 78%; --start-x:-12px; --end-x:32px;  animation-duration: 8.6s;  animation-delay: 0.05s; --angle:11deg; }
        .raindrop:nth-child(18) { left: 86%; --start-x:-7px;  --end-x:18px;  animation-duration: 6.2s;  animation-delay: 0.65s; --angle:7deg; }

        /* Make drops slightly different heights/opacity */
        .raindrop:nth-child(odd)  { height: 14px; opacity: 0.82; }
        .raindrop:nth-child(even) { height: 18px; opacity: 0.9; }

        /* Mobile: reduce count/visibility for performance */
        @media (max-width: 600px) {
            .raindrop { opacity: 0.7; filter: none; }
            .raindrop:nth-child(n+11) { display: none; } /* show fewer drops on small screens */
        }

        /* Main Container Card */
        .container {
            width: 100%;
            max-width: 460px;
            padding: 35px 25px;
            background: rgba(18, 18, 18, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            margin: 20px;
        }

        /* Profile Section */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .avatar-decoration {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            pointer-events: none;
        }

        .username {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .bio {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
        }

        /* Discord Presence Card */
        .discord-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            margin-bottom: 25px;
        }

        .discord-avatar-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .discord-status {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #747f8d; /* Offline */
            border: 2px solid #121212;
        }

        .discord-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .discord-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .discord-username {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .guild-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }

        .guild-tag img {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .discord-last-seen {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Social Icons */
        .socials {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 25px;
        }

        .social-icon {
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icon:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.15);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        /* Music Player Box */
        .music-player {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .music-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .music-details {
            flex: 1;
        }

        .music-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .time-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            width: 25px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 13%;
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .music-controls i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .music-controls i:hover {
            color: #fff;
        }

        /* Page Views Badge (Bottom Left) */
        .views-badge {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);

            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }
    </style>
</head>
